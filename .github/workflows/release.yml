name: Release packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
            target: '--win zip nsis --x64'
          - os: macos-15
            platform: darwin
            arch: arm64
            target: '--mac zip --arm64'
          - os: macos-15-intel
            platform: darwin
            arch: x64
            target: '--mac zip --x64'
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            target: '--linux AppImage deb tar.gz --x64'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: python scripts/check-public.py
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if(process.env.RELEASE_TAG !== 'v'+require('./desktop/package.json').version) process.exit(1)"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: go vet ./...
      - run: go test ./...
      - run: npm ci --no-fund
        working-directory: desktop
      - run: npm run backend -- ${{ matrix.platform }} ${{ matrix.arch }}
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: npx electron-builder ${{ matrix.target }} --publish never
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify Linux packages
        if: runner.os == 'Linux'
        run: python3 scripts/check-linux-release.py
      - name: Linux packaged desktop smoke
        if: runner.os == 'Linux'
        working-directory: desktop
        run: |
          sudo chown root:root release/linux-unpacked/chrome-sandbox
          sudo chmod 4755 release/linux-unpacked/chrome-sandbox
          export GPTBRIDGE_TEST_APP="$PWD/release/linux-unpacked/wishtoken-desktop"
          dbus-run-session -- xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: client-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/WishToken-Desktop-*.exe
            desktop/release/WishToken-Desktop-*.zip
            desktop/release/WishToken-Desktop-*.AppImage
            desktop/release/WishToken-Desktop-*.deb
            desktop/release/WishToken-Desktop-*.tar.gz
          if-no-files-found: error
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: packages
          merge-multiple: true
      - name: Create checksums
        working-directory: packages
        run: sha256sum WishToken-Desktop-* > SHA256SUMS.txt
      - name: Create draft for maintainer review
        run: gh release create "$RELEASE_TAG" packages/* --repo "$REPO" --draft --title "WishToken Desktop $RELEASE_TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
